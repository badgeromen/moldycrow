# Push a tag like v0.2.0 and this builds Moldy Crow for Windows, macOS (Apple Silicon + Intel) and Linux,
# then attaches the zips to a GitHub Release. Run it by hand from the Actions tab to just get the build artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MoldyCrow-windows
            onefile: --onefile
          - os: macos-latest
            asset: MoldyCrow-macos-apple-silicon
          - os: macos-15-intel
            asset: MoldyCrow-macos-intel
          - os: ubuntu-22.04
            asset: MoldyCrow-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name MoldyCrow ${{ matrix.onefile }}
          --hidden-import PyQt6.QtMultimedia
          --osx-bundle-identifier com.github.moldycrow
          packaging/launcher.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/MoldyCrow.exe "${{ matrix.asset }}.exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MoldyCrow.app "${{ matrix.asset }}.zip"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir AppDir
          cp -r dist/MoldyCrow AppDir/
          cp packaging/AppRun packaging/moldycrow.desktop packaging/moldycrow.png AppDir/
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "${{ matrix.asset }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | System | File | How to run |
            |---|---|---|
            | **Windows** | `MoldyCrow-windows.exe` | Double-click it. If SmartScreen warns about an unknown publisher: **More info → Run anyway**. |
            | **Mac (M1/M2/M3/M4)** | `MoldyCrow-macos-apple-silicon.zip` | Unzip, then **right-click MoldyCrow.app → Open** the first time. |
            | **Mac (Intel)** | `MoldyCrow-macos-intel.zip` | Same as above. |
            | **Linux** | `MoldyCrow-linux-x86_64.AppImage` | Make it executable (`chmod +x`, or Properties → Allow executing) and double-click it. |

            **Ignore the "Source code" files below.** GitHub adds them automatically; they are not the app.
            You need [The Force Engine](https://theforceengine.github.io) set up with your own copy of Dark Forces. Put mod zips in The Force Engine's `Mods` folder.
