[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moldycrow"
dynamic = ["version"]
description = "Dark Forces mod tracker with a random mission picker and level maps, for The Force Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PyQt6>=6.5"]

[project.gui-scripts]
moldycrow = "moldycrow.app:main"

[tool.setuptools]
packages = ["moldycrow"]

[tool.setuptools.dynamic]
version = { attr = "moldycrow.__version__" }
